<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>Royal Chess</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#070a10;
    --panel:rgba(20,25,36,.82);
    --line:rgba(255,255,255,.08);
    --text:#f7f7fb;
    --muted:#8992a4;

    --light:#ead8b9;
    --dark:#98704d;

    --purple:#8b5cf6;
    --pink:#ec4899;
    --green:#45dc8b;
    --red:#ff526d;
    --gold:#ffd45c;
}

html,body{
    margin:0;
    min-height:100%;
    background:
        radial-gradient(circle at 10% 0%,
        rgba(139,92,246,.22),
        transparent 32%),
        radial-gradient(circle at 90% 10%,
        rgba(236,72,153,.16),
        transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
}

button,select{
    font:inherit;
}

button{
    color:white;
    border:0;
    cursor:pointer;
}

.app{
    width:min(1100px,100%);
    padding:15px 12px 30px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:43px;
    height:43px;
    display:grid;
    place-items:center;
    border-radius:14px;
    font-size:25px;
    background:
        linear-gradient(135deg,
        var(--purple),
        var(--pink));
    box-shadow:
        0 8px 25px rgba(139,92,246,.3);
}

.brand h1{
    margin:0;
    font-size:20px;
}

.brand p{
    margin:2px 0 0;
    color:var(--muted);
    font-size:10px;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:13px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
}

/* LAYOUT */

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 300px;
    gap:17px;
}

.left{
    min-width:0;
}

/* PLAYER */

.player{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 12px;
    margin-bottom:8px;
    border-radius:15px;
    background:var(--panel);
    border:1px solid var(--line);
    backdrop-filter:blur(15px);
}

.player-info{
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:37px;
    height:37px;
    display:grid;
    place-items:center;
    border-radius:11px;
    background:rgba(255,255,255,.07);
    font-size:18px;
}

.player-name{
    font-size:13px;
    font-weight:700;
}

.player-color{
    margin-top:2px;
    color:var(--muted);
    font-size:10px;
}

.clock{
    min-width:82px;
    padding:7px 10px;
    border-radius:10px;
    background:rgba(0,0,0,.28);
    text-align:center;
    font-size:19px;
    font-weight:800;
    letter-spacing:1px;
}

.clock.active{
    background:
        linear-gradient(135deg,
        rgba(139,92,246,.42),
        rgba(236,72,153,.25));
    box-shadow:
        0 0 20px rgba(139,92,246,.18);
}

.clock.danger{
    color:#ff6379;
    animation:danger .65s infinite;
}

@keyframes danger{
    50%{transform:scale(1.03)}
}

/* BOARD */

.board-frame{
    width:min(94vw,680px);
    margin:auto;
    padding:7px;
    border-radius:20px;
    background:
        linear-gradient(145deg,
        rgba(255,255,255,.1),
        rgba(255,255,255,.025));
    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.1);
}

.board{
    position:relative;
    width:100%;
    aspect-ratio:1;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    overflow:hidden;
    border-radius:14px;
    touch-action:none;
}

.square{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    user-select:none;
    cursor:pointer;
}

.light{
    background:var(--light);
}

.dark{
    background:var(--dark);
}

.square.last{
    box-shadow:
        inset 0 0 0 999px rgba(255,215,70,.14);
}

.square.selected{
    box-shadow:
        inset 0 0 0 4px var(--gold);
}

.square.check{
    box-shadow:
        inset 0 0 0 5px rgba(255,45,70,.8);
}

.square.target::before{
    content:"";
    position:absolute;
    z-index:2;
    width:24%;
    aspect-ratio:1;
    border-radius:50%;
    background:rgba(20,20,20,.27);
}

.square.capture::before{
    content:"";
    position:absolute;
    z-index:2;
    inset:8%;
    border:5px solid rgba(255,65,80,.68);
    border-radius:50%;
}

.piece{
    position:relative;
    z-index:3;
    font-family:
        "Arial Unicode MS",
        "Segoe UI Symbol",
        sans-serif;
    font-size:clamp(31px,9vw,73px);
    line-height:1;
    user-select:none;
    transition:
        transform .12s ease,
        opacity .12s ease;
}

.square:active .piece{
    transform:scale(.9);
}

.white-piece{
    color:#fffaf0;
    text-shadow:
        0 2px 2px rgba(0,0,0,.7),
        0 4px 7px rgba(0,0,0,.35);
}

.black-piece{
    color:#161616;
    text-shadow:
        0 1px 1px rgba(255,255,255,.4),
        0 4px 7px rgba(0,0,0,.5);
}

.animate{
    animation:appear .16s ease-out;
}

@keyframes appear{
    from{
        transform:scale(.65);
        opacity:.2;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* STATUS */

.status{
    margin-top:8px;
    padding:10px;
    border-radius:13px;
    text-align:center;
    background:rgba(255,255,255,.045);
    border:1px solid var(--line);
    font-size:12px;
    font-weight:700;
}

/* RIGHT */

.right{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.panel{
    padding:14px;
    border-radius:17px;
    background:var(--panel);
    border:1px solid var(--line);
    backdrop-filter:blur(16px);
}

.panel-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.panel-title strong{
    font-size:13px;
}

.badge{
    padding:4px 8px;
    border-radius:7px;
    color:#c8b8ff;
    background:rgba(139,92,246,.13);
    font-size:9px;
}

/* SETTINGS */

.setting{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:5px 0;
}

.setting span{
    color:#c8ccd6;
    font-size:12px;
}

select{
    padding:7px 9px;
    border-radius:9px;
    color:white;
    background:#171c27;
    border:1px solid var(--line);
    outline:none;
    font-size:11px;
}

/* BUTTONS */

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.btn{
    padding:11px 8px;
    border-radius:11px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
    font-size:11px;
    font-weight:700;
    transition:.15s;
}

.btn:active{
    transform:scale(.96);
}

.btn.primary{
    background:
        linear-gradient(135deg,
        #7c3aed,
        #db2777);
}

.btn.danger{
    color:#ff8c9c;
}

/* MOVES */

.moves{
    height:245px;
    overflow:auto;
}

.move-row{
    display:grid;
    grid-template-columns:28px 1fr 1fr;
    padding:6px 4px;
    border-radius:7px;
    font-size:11px;
}

.move-row:nth-child(odd){
    background:rgba(255,255,255,.025);
}

.num{
    color:var(--muted);
}

.move-white,
.move-black{
    font-weight:700;
}

/* PROMOTION */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(12px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(410px,100%);
    padding:23px;
    border-radius:23px;
    background:#141923;
    border:1px solid var(--line);
    box-shadow:0 30px 90px rgba(0,0,0,.7);
    text-align:center;
}

.modal h2{
    margin:5px 0;
}

.modal p{
    color:var(--muted);
    font-size:12px;
}

.promotion{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:15px;
}

.promotion button{
    padding:10px;
    border-radius:12px;
    background:rgba(255,255,255,.07);
    border:1px solid var(--line);
}

.promo-piece{
    display:block;
    font-size:38px;
    margin-bottom:4px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:13px;
}

.modal-actions button{
    flex:1;
    padding:11px;
    border-radius:11px;
    background:rgba(255,255,255,.07);
}

.modal-actions .primary{
    background:linear-gradient(135deg,#7c3aed,#db2777);
}

/* MOBILE */

@media(max-width:850px){

    .app{
        padding:9px 7px 25px;
    }

    .layout{
        display:block;
    }

    .right{
        margin-top:10px;
    }

    .board-frame{
        width:min(97vw,650px);
        padding:5px;
        border-radius:17px;
    }

    .piece{
        font-size:clamp(28px,10.5vw,66px);
    }

    .moves-panel{
        display:none;
    }

    .right{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .settings-panel{
        grid-column:1 / -1;
    }

    .controls-panel{
        grid-column:1 / -1;
    }
}

@media(max-width:450px){

    .brand h1{
        font-size:17px;
    }

    .brand p{
        font-size:9px;
    }

    .logo{
        width:38px;
        height:38px;
    }

    .clock{
        min-width:73px;
        font-size:17px;
    }
}
</style>
</head>


<body>

<div class="app">

<header class="header">

    <div class="brand">

        <div class="logo">♛</div>

        <div>
            <h1>Royal Chess</h1>
            <p>Premium Chess Experience</p>
        </div>

    </div>

    <button
        class="icon-btn"
        id="soundBtn"
        onclick="toggleSound()">
        🔊
    </button>

</header>


<div class="layout">

<main class="left">

    <!-- BLACK -->

    <div class="player">

        <div class="player-info">

            <div class="avatar"
                 id="blackAvatar">
                🤖
            </div>

            <div>

                <div class="player-name"
                     id="blackName">
                    Computer
                </div>

                <div class="player-color">
                    Black
                </div>

            </div>

        </div>

        <div class="clock"
             id="blackClock">
            10:00
        </div>

    </div>


    <!-- BOARD -->

    <div class="board-frame">

        <div class="board"
             id="board">
        </div>

    </div>


    <!-- WHITE -->

    <div class="player">

        <div class="player-info">

            <div class="avatar">
                ♙
            </div>

            <div>

                <div class="player-name">
                    You
                </div>

                <div class="player-color">
                    White
                </div>

            </div>

        </div>

        <div class="clock"
             id="whiteClock">
            10:00
        </div>

    </div>


    <div class="status"
         id="status">
        White to move
    </div>

</main>


<aside class="right">

    <!-- SETTINGS -->

    <div class="panel settings-panel">

        <div class="panel-title">

            <strong>Game Settings</strong>

            <span class="badge">
                LIVE
            </span>

        </div>


        <div class="setting">

            <span>Game Mode</span>

            <select id="mode"
                    onchange="modeChanged()">

                <option value="ai">
                    1 Player
                </option>

                <option value="local">
                    2 Players
                </option>

            </select>

        </div>


        <div class="setting"
             id="difficultySetting">

            <span>Difficulty</span>

            <select id="difficulty">

                <option value="1">
                    Easy
                </option>

                <option value="2"
                        selected>
                    Medium
                </option>

                <option value="3">
                    Hard
                </option>

            </select>

        </div>


        <div class="setting">

            <span>Time Control</span>

            <select id="timeControl">

                <option value="1">
                    1 + 0
                </option>

                <option value="3">
                    3 + 0
                </option>

                <option value="5">
                    5 + 0
                </option>

                <option value="10"
                        selected>
                    10 + 0
                </option>

                <option value="15">
                    15 + 10
                </option>

            </select>

        </div>

    </div>


    <!-- CONTROLS -->

    <div class="panel controls-panel">

        <div class="controls">

            <button
                class="btn primary"
                onclick="newGame()">
                ♟ New Game
            </button>

            <button
                class="btn"
                onclick="undoMove()">
                ↩ Undo
            </button>

            <button
                class="btn"
                onclick="flipBoard()">
                🔃 Flip
            </button>

            <button
                class="btn danger"
                onclick="resign()">
                🏳 Resign
            </button>

        </div>

    </div>


    <!-- MOVES -->

    <div class="panel moves-panel">

        <div class="panel-title">

            <strong>Move History</strong>

            <span
                class="badge"
                id="moveCount">
                0 moves
            </span>

        </div>

        <div class="moves"
             id="moves">
        </div>

    </div>

</aside>

</div>
</div>


<!-- PROMOTION / GAME OVER MODAL -->

<div class="modal"
     id="modal">

    <div class="modal-box">

        <h2 id="modalTitle">
            Choose Promotion
        </h2>

        <p id="modalText">
            Select a piece.
        </p>

        <div
            class="promotion"
            id="promotionButtons">
        </div>

        <div class="modal-actions">

            <button onclick="closeModal()">
                Cancel
            </button>

            <button
                class="primary"
                id="modalNewGame"
                onclick="newGame();closeModal()">
                New Game
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   ROYAL CHESS
   SELF-CONTAINED CHESS ENGINE
========================================================= */

const SYMBOLS={
    wK:"♔",
    wQ:"♕",
    wR:"♖",
    wB:"♗",
    wN:"♘",
    wP:"♙",

    bK:"♚",
    bQ:"♛",
    bR:"♜",
    bB:"♝",
    bN:"♞",
    bP:"♟"
};

const VALUE={
    P:100,
    N:320,
    B:330,
    R:500,
    Q:900,
    K:20000
};


/* =========================================================
   STATE
========================================================= */

let board;
let turn;
let selected;
let targets;
let gameOver;
let flipped=false;

let mode="ai";
let difficulty=2;

let castling;
let enPassant;

let history=[];
let moves=[];

let lastMove=null;

let whiteTime;
let blackTime;
let increment=0;
let clockTimer=null;

let soundOn=true;
let audio=null;


/* =========================================================
   BOARD
========================================================= */

function startingBoard(){

return [

["bR","bN","bB","bQ","bK","bB","bN","bR"],

["bP","bP","bP","bP","bP","bP","bP","bP"],

[null,null,null,null,null,null,null,null],

[null,null,null,null,null,null,null,null],

[null,null,null,null,null,null,null,null],

[null,null,null,null,null,null,null,null],

["wP","wP","wP","wP","wP","wP","wP","wP"],

["wR","wN","wB","wQ","wK","wB","wN","wR"]

];

}


/* =========================================================
   BASIC HELPERS
========================================================= */

function cloneBoard(b){
    return b.map(row=>row.slice());
}

function inside(r,c){
    return r>=0&&r<8&&c>=0&&c<8;
}

function color(p){
    return p?p[0]:null;
}

function pieceType(p){
    return p?p[1]:null;
}

function opposite(c){
    return c==="w"?"b":"w";
}

function squareName(r,c){
    return "abcdefgh"[c]+(8-r);
}


/* =========================================================
   ATTACK DETECTION
========================================================= */

function findKing(c,b=board){

    for(let r=0;r<8;r++)
        for(let col=0;col<8;col++)
            if(b[r][col]===c+"K")
                return {r,c:col};

    return null;
}


function attacked(r,c,by,b){

    /* Pawn attacks */

    const pawnRow=
        r+(by==="w"?1:-1);

    for(const dc of [-1,1]){

        const pc=c+dc;

        if(
            inside(pawnRow,pc) &&
            b[pawnRow][pc]===by+"P"
        )
            return true;
    }


    /* Knight attacks */

    const knightDirs=[
        [-2,-1],[-2,1],
        [-1,-2],[-1,2],
        [1,-2],[1,2],
        [2,-1],[2,1]
    ];

    for(const [dr,dc] of knightDirs){

        const rr=r+dr;
        const cc=c+dc;

        if(
            inside(rr,cc) &&
            b[rr][cc]===by+"N"
        )
            return true;
    }


    /* King attacks */

    for(let dr=-1;dr<=1;dr++){

        for(let dc=-1;dc<=1;dc++){

            if(!dr&&!dc)
                continue;

            const rr=r+dr;
            const cc=c+dc;

            if(
                inside(rr,cc) &&
                b[rr][cc]===by+"K"
            )
                return true;
        }
    }


    /* Sliding attacks */

    const rookDirs=[
        [1,0],[-1,0],
        [0,1],[0,-1]
    ];

    for(const [dr,dc] of rookDirs){

        let rr=r+dr;
        let cc=c+dc;

        while(inside(rr,cc)){

            const p=b[rr][cc];

            if(p){

                if(
                    color(p)===by &&
                    (
                        pieceType(p)==="R" ||
                        pieceType(p)==="Q"
                    )
                )
                    return true;

                break;
            }

            rr+=dr;
            cc+=dc;
        }
    }


    const bishopDirs=[
        [1,1],[1,-1],
        [-1,1],[-1,-1]
    ];

    for(const [dr,dc] of bishopDirs){

        let rr=r+dr;
        let cc=c+dc;

        while(inside(rr,cc)){

            const p=b[rr][cc];

            if(p){

                if(
                    color(p)===by &&
                    (
                        pieceType(p)==="B" ||
                        pieceType(p)==="Q"
                    )
                )
                    return true;

                break;
            }

            rr+=dr;
            cc+=dc;
        }
    }

    return false;
}


function inCheck(c,b=board){

    const k=findKing(c,b);

    if(!k)
        return true;

    return attacked(
        k.r,
        k.c,
        opposite(c),
        b
    );
}


/* =========================================================
   PSEUDO MOVES
========================================================= */

function pseudoMoves(r,c,b=board){

    const p=b[r][c];

    if(!p)
        return [];

    const col=color(p);
    const t=pieceType(p);
    const result=[];


    function add(rr,cc,extra={}){

        if(!inside(rr,cc))
            return;

        if(
            !b[rr][cc] ||
            color(b[rr][cc])!==col
        ){

            result.push({
                r:rr,
                c:cc,
                ...extra
            });
        }
    }


    /* PAWN */

    if(t==="P"){

        const dir=
            col==="w"?-1:1;

        const start=
            col==="w"?6:1;


        if(
            inside(r+dir,c) &&
            !b[r+dir][c]
        ){

            result.push({
                r:r+dir,
                c
            });


            if(
                r===start &&
                !b[r+2*dir][c]
            ){

                result.push({
                    r:r+2*dir,
                    c
                });
            }
        }


        for(const dc of [-1,1]){

            const rr=r+dir;
            const cc=c+dc;

            if(
                inside(rr,cc) &&
                b[rr][cc] &&
                color(b[rr][cc])!==col
            ){

                result.push({
                    r:rr,
                    c:cc
                });
            }


            /* EN PASSANT */

            if(
                enPassant &&
                enPassant.r===rr &&
                enPassant.c===cc
            ){

                result.push({
                    r:rr,
                    c:cc,
                    ep:true
                });
            }
        }

    }


    /* KNIGHT */

    if(t==="N"){

        const dirs=[
            [-2,-1],[-2,1],
            [-1,-2],[-1,2],
            [1,-2],[1,2],
            [2,-1],[2,1]
        ];

        dirs.forEach(
            ([dr,dc])=>
            add(r+dr,c+dc)
        );
    }


    /* KING */

    if(t==="K"){

        for(let dr=-1;dr<=1;dr++)
            for(let dc=-1;dc<=1;dc++)
                if(dr||dc)
                    add(r+dr,c+dc);


        /* CASTLING */

        if(!inCheck(col,b)){

            if(col==="w" && r===7 && c===4){

                if(
                    castling.wK &&
                    b[7][5]===null &&
                    b[7][6]===null &&
                    b[7][7]==="wR" &&
                    !attacked(7,5,"b",b) &&
                    !attacked(7,6,"b",b)
                ){

                    result.push({
                        r:7,
                        c:6,
                        castle:"K"
                    });
                }


                if(
                    castling.wQ &&
                    b[7][1]===null &&
                    b[7][2]===null &&
                    b[7][3]===null &&
                    b[7][0]==="wR" &&
                    !attacked(7,3,"b",b) &&
                    !attacked(7,2,"b",b)
                ){

                    result.push({
                        r:7,
                        c:2,
                        castle:"Q"
                    });
                }
            }


            if(col==="b" && r===0 && c===4){

                if(
                    castling.bK &&
                    b[0][5]===null &&
                    b[0][6]===null &&
                    b[0][7]==="bR" &&
                    !attacked(0,5,"w",b) &&
                    !attacked(0,6,"w",b)
                ){

                    result.push({
                        r:0,
                        c:6,
                        castle:"K"
                    });
                }


                if(
                    castling.bQ &&
                    b[0][1]===null &&
                    b[0][2]===null &&
                    b[0][3]===null &&
                    b[0][0]==="bR" &&
                    !attacked(0,3,"w",b) &&
                    !attacked(0,2,"w",b)
                ){

                    result.push({
                        r:0,
                        c:2,
                        castle:"Q"
                    });
                }
            }
        }
    }


    /* ROOK / BISHOP / QUEEN */

    if(
        t==="R" ||
        t==="B" ||
        t==="Q"
    ){

        const dirs=[];

        if(t==="R"||t==="Q")
            dirs.push(
                [1,0],[-1,0],
                [0,1],[0,-1]
            );

        if(t==="B"||t==="Q")
            dirs.push(
                [1,1],[1,-1],
                [-1,1],[-1,-1]
            );


        for(const [dr,dc] of dirs){

            let rr=r+dr;
            let cc=c+dc;

            while(inside(rr,cc)){

                if(!b[rr][cc]){

                    result.push({
                        r:rr,
                        c:cc
                    });

                }else{

                    if(
                        color(b[rr][cc])!==col
                    ){

                        result.push({
                            r:rr,
                            c:cc
                        });
                    }

                    break;
                }

                rr+=dr;
                cc+=dc;
            }
        }
    }

    return result;
}


/* =========================================================
   APPLY MOVE TO TEMP BOARD
========================================================= */

function applyTemporary(b,from,to){

    const p=b[from.r][from.c];
    const col=color(p);

    b[to.r][to.c]=p;
    b[from.r][from.c]=null;


    if(to.ep){

        const capturedRow=
            to.r+(col==="w"?1:-1);

        b[capturedRow][to.c]=null;
    }


    if(to.castle==="K"){

        b[to.r][5]=b[to.r][7];
        b[to.r][7]=null;
    }

    if(to.castle==="Q"){

        b[to.r][3]=b[to.r][0];
        b[to.r][0]=null;
    }


    /* Promotion for legality */

    if(p==="wP" && to.r===0)
        b[to.r][to.c]="wQ";

    if(p==="bP" && to.r===7)
        b[to.r][to.c]="bQ";
}


/* =========================================================
   LEGAL MOVES
========================================================= */

function legalMoves(r,c){

    const p=board[r][c];

    if(!p)
        return [];

    const col=color(p);

    const pseudo=
        pseudoMoves(r,c,board);

    const legal=[];

    for(const move of pseudo){

        const test=
            cloneBoard(board);

        applyTemporary(
            test,
            {r,c},
            move
        );

        if(!inCheck(col,test))
            legal.push(move);
    }

    return legal;
}


function allMoves(col,b=board){

    const result=[];

    const oldBoard=board;

    board=b;

    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            if(
                board[r][c] &&
                color(board[r][c])===col
            ){

                for(
                    const move of legalMoves(r,c)
                ){

                    result.push({

                        fr:r,
                        fc:c,

                        r:move.r,
                        c:move.c,

                        ep:move.ep,
                        castle:move.castle

                    });
                }
            }
        }
    }

    board=oldBoard;

    return result;
}


/* =========================================================
   POSITION SNAPSHOT
========================================================= */

function snapshot(){

    return {

        board:cloneBoard(board),

        turn,

        castling:{...castling},

        enPassant:
            enPassant
            ?{...enPassant}
            :null,

        whiteTime,
        blackTime,

        increment,

        moves:
            moves.map(x=>({...x})),

        lastMove:
            lastMove
            ?{...lastMove}
            :null
    };
}


function restore(state){

    board=
        cloneBoard(state.board);

    turn=state.turn;

    castling={
        ...state.castling
    };

    enPassant=
        state.enPassant
        ?{...state.enPassant}
        :null;

    whiteTime=
        state.whiteTime;

    blackTime=
        state.blackTime;

    increment=
        state.increment;

    moves=
        state.moves.map(x=>({...x}));

    lastMove=
        state.lastMove
        ?{...state.lastMove}
        :null;

    selected=null;
    targets=[];

    updateEverything();
}


/* =========================================================
   MAKE REAL MOVE
========================================================= */

function makeMove(fr,fc,tr,tc,promotion=null){

    const p=board[fr][fc];

    if(!p)
        return false;

    const legal=
        legalMoves(fr,fc);

    const move=
        legal.find(
            m=>m.r===tr &&
               m.c===tc
        );

    if(!move)
        return false;


    history.push(snapshot());


    const captured=
        board[tr][tc];

    const col=color(p);


    board[tr][tc]=p;
    board[fr][fc]=null;


    /* En passant */

    if(move.ep){

        const row=
            tr+(col==="w"?1:-1);

        board[row][tc]=null;
    }


    /* Castling */

    if(move.castle==="K"){

        board[tr][5]=board[tr][7];
        board[tr][7]=null;
    }

    if(move.castle==="Q"){

        board[tr][3]=board[tr][0];
        board[tr][0]=null;
    }


    /* Castling rights */

    updateCastleRights(
        p,
        fr,
        fc,
        tr,
        tc,
        captured
    );


    /* EP square */

    enPassant=null;

    if(
        pieceType(p)==="P" &&
        Math.abs(tr-fr)===2
    ){

        enPassant={
            r:(tr+fr)/2,
            c:fc
        };
    }


    /* Promotion */

    if(
        p==="wP" &&
        tr===0
    ){

        if(promotion){

            board[tr][tc]=
                "w"+promotion;

        }else{

            board[tr][tc]="wQ";
        }
    }


    if(
        p==="bP" &&
        tr===7
    ){

        if(promotion){

            board[tr][tc]=
                "b"+promotion;

        }else{

            board[tr][tc]="bQ";
        }
    }


    /* Move notation */

    let notation;

    if(move.castle){

        notation=
            move.castle==="K"
            ?"O-O"
            :"O-O-O";

    }else{

        const capture=
            captured ||
            move.ep;

        notation=
            squareName(fr,fc)+
            (capture?"x":"-")+
            squareName(tr,tc);

        if(
            pieceType(p)==="P" &&
            (tr===0||tr===7)
        ){

            notation+=
                "="+
                (promotion||"Q");
        }
    }


    moves.push({
        color:col,
        notation
    });


    lastMove={
        fr,
        fc,
        tr,
        tc
    };


    if(col==="w")
        whiteTime+=increment;
    else
        blackTime+=increment;


    turn=
        opposite(turn);


    selected=null;
    targets=[];


    playSound(
        captured||move.ep
        ?"capture"
        :move.castle
        ?"castle"
        :"move"
    );


    updateEverything();

    return true;
}


/* =========================================================
   CASTLING RIGHTS
========================================================= */

function updateCastleRights(
    piece,
    fr,
    fc,
    tr,
    tc,
    captured
){

    if(piece==="wK"){
        castling.wK=false;
        castling.wQ=false;
    }

    if(piece==="bK"){
        castling.bK=false;
        castling.bQ=false;
    }


    if(piece==="wR" &&
       fr===7 &&
       fc===0)
        castling.wQ=false;

    if(piece==="wR" &&
       fr===7 &&
       fc===7)
        castling.wK=false;

    if(piece==="bR" &&
       fr===0 &&
       fc===0)
        castling.bQ=false;

    if(piece==="bR" &&
       fr===0 &&
       fc===7)
        castling.bK=false;


    if(captured==="wR"){

        if(tr===7&&tc===0)
            castling.wQ=false;

        if(tr===7&&tc===7)
            castling.wK=false;
    }


    if(captured==="bR"){

        if(tr===0&&tc===0)
            castling.bQ=false;

        if(tr===0&&tc===7)
            castling.bK=false;
    }
}


/* =========================================================
   BOARD CLICK
========================================================= */

function clickSquare(r,c){

    if(gameOver)
        return;

    if(mode==="ai" && turn==="b")
        return;


    const p=board[r][c];


    if(selected){

        const target=
            targets.find(
                m=>m.r===r&&m.c===c
            );


        if(target){

            const moving=
                board[selected.r][selected.c];


            /* Promotion */

            if(
                pieceType(moving)==="P" &&
                (r===0||r===7)
            ){

                showPromotion(
                    selected.r,
                    selected.c,
                    r,
                    c
                );

                return;
            }


            makeMove(
                selected.r,
                selected.c,
                r,
                c
            );

            afterPlayerMove();

            return;
        }


        if(
            p &&
            color(p)===turn
        ){

            selected={r,c};

            targets=
                legalMoves(r,c);

            render();

            return;
        }


        selected=null;
        targets=[];

        render();

        return;
    }


    if(
        p &&
        color(p)===turn
    ){

        selected={r,c};

        targets=
            legalMoves(r,c);

        render();
    }
}


/* =========================================================
   AFTER PLAYER MOVE
========================================================= */

function afterPlayerMove(){

    checkGameState();

    if(
        !gameOver &&
        mode==="ai" &&
        turn==="b"
    ){

        document.getElementById(
            "status"
        ).textContent=

        );

}


/* =========================================================
   PROMOTION
========================================================= */

let pendingPromotion=null;

function showPromotion(fr,fc,tr,tc){

    pendingPromotion={
        fr,fc,tr,tc
    };


    const col=
        color(board[fr][fc]);


    const pieces=[
        ["Q","Queen"],
        ["R","Rook"],
        ["B","Bishop"],
        ["N","Knight"]
    ];


    const container=
        document.getElementById(
            "promotionButtons"
        );

    container.innerHTML="";


    for(const [type,name] of pieces){

        const button=
            document.createElement("button");

        button.innerHTML=
            `<span class="promo-piece">
                ${SYMBOLS[col+type]}
             </span>${name}`;

        button.onclick=
            ()=>finishPromotion(type);

        container.appendChild(button);
    }


    document.getElementById(
        "modalTitle"
    ).textContent=
        "Choose Promotion";

    document.getElementById(
        "modalText"
    ).textContent=
        "Choose the piece your pawn should become.";

    document.getElementById(
        "modalNewGame"
    ).style.display="none";

    document.getElementById(
        "modal"
    ).classList.add("show");
}


function finishPromotion(type){

    if(!pendingPromotion)
        return;

    const p=
        pendingPromotion;

    pendingPromotion=null;

    closeModal();

    makeMove(
        p.fr,
        p.fc,
        p.tr,
        p.tc,
        type
    );

    afterPlayerMove();
}


/* =========================================================
   GAME STATE CHECK
========================================================= */

function checkGameState(){

    const legal=
        allMoves(turn);

    const check=
        inCheck(turn);


    if(check)
        playSound("check");


    if(!legal.length){

        gameOver=true;

        stopClock();


        if(check){

            const winner=
                opposite(turn)==="w"
                ?"White"
                :"Black";


            showGameOver(
                "♚",
                "Checkmate!",
                winner+" wins by checkmate."
            );

            playSound("game");

        }else{

            showGameOver(
                "🤝",
                "Stalemate",
                "The game ends in a draw."
            );
        }

        updateEverything();

        return;
    }


    if(check){

        document.getElementById(
            "status"
        ).textContent=
            turn==="w"
            ?"⚠️ Check! Your king is attacked."
            :"⚠️ Check! Black king is attacked.";

    }else{

        if(mode==="local"){

            document.getElementById(
                "status"
            ).textContent=
                turn==="w"
                ?"White to move"
                :"Black to move";

        }else{

            document.getElementById(
                "status"
            ).textContent=
                turn==="w"
                ?"Your turn — White"
                :"Computer's turn — Black";
        }
    }
}


/* =========================================================
   AI
========================================================= */

function evaluate(b){

    let score=0;


    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            const p=b[r][c];

            if(!p)
                continue;

            let value=
                VALUE[pieceType(p)];


            /* Small positional bonus */

            if(
                pieceType(p)==="P"
            ){

                const advance=
                    color(p)==="b"
                    ?r
                    :7-r;

                value+=advance*3;
            }


            if(
                pieceType(p)==="N" ||
                pieceType(p)==="B"
            ){

                if(
                    r>=2 &&
                    r<=5 &&
                    c>=2 &&
                    c<=5
                )
                    value+=12;
            }


            score+=
                color(p)==="b"
                ?value
                :-value;
        }
    }

    return score;
}


function aiMove(){

    const legal=
        allMoves("b");

    if(!legal.length)
        return;


    const level=
        Number(
            document.getElementById(
                "difficulty"
            ).value
        );


    /* Easy */

    if(level===1){

        return legal[
            Math.floor(
                Math.random()*legal.length
            )
        ];
    }


    const depth=
        level===2
        ?2
        :3;


    let best=null;
    let bestScore=-Infinity;


    for(const move of legal){

        const test=
            cloneBoard(board);

        applyTemporary(
            test,
            {
                r:move.fr,
                c:move.fc
            },
            move
        );


        const score=
            minimax(
                test,
                depth-1,
                false,
                -Infinity,
                Infinity
            );


        if(
            score>bestScore ||
            best===null
        ){

            bestScore=score;
            best=move;
        }
    }


    return best;
}


function minimax(
    b,
    depth,
    maximizing,
    alpha,
    beta
){

    if(depth===0)
        return evaluate(b);


    const col=
        maximizing
        ?"b"
        :"w";


    const legal=
        allMoves(col,b);


    if(!legal.length){

        if(inCheck(col,b)){

            return maximizing
                ?-1000000
                :1000000;
        }

        return 0;
    }


    if(maximizing){

        let value=-Infinity;

        for(const move of legal){

            const test=
                cloneBoard(b);

            applyTemporary(
                test,
                {
                    r:move.fr,
                    c:move.fc
                },
                move
            );


            value=Math.max(
                value,
                minimax(
                    test,
                    depth-1,
                    false,
                    alpha,
                    beta
                )
            );


            alpha=
                Math.max(alpha,value);

            if(beta<=alpha)
                break;
        }

        return value;

    }else{

        let value=Infinity;

        for(const move of legal){

            const test=
                cloneBoard(b);

            applyTemporary(
                test,
                {
                    r:move.fr,
                    c:move.fc
                },
                move
            );


            value=Math.min(
                value,
                minimax(
                    test,
                    depth-1,
                    true,
                    alpha,
                    beta
                )
            );


            beta=
                Math.min(beta,value);

            if(beta<=alpha)
                break;
        }

        return value;
    }
}


function computerMove(){

    if(
        gameOver ||
        mode!=="ai" ||
        turn!=="b"
    )
        return;


    const move=aiMove();

    if(!move)
        return;


    makeMove(
        move.fr,
        move.fc,
        move.r,
        move.c
    );

}


/* =========================================================
   UNDO
========================================================= */

function undoMove(){

    if(!history.length ||
       gameOver)
        return;


    /* In AI mode undo both
       player's and computer's move */

    let state=
        history.pop();

    restore(state);


    if(
        mode==="ai" &&
        turn==="b" &&
        history.length
    ){

        state=
            history.pop();

        restore(state);
    }


    updateEverything();
}


/* =========================================================
   CLOCK
========================================================= */

function startClock(){

    stopClock();

    clockTimer=
        setInterval(()=>{

            if(gameOver)
                return;


            if(turn==="w"){

                whiteTime--;

                if(whiteTime<=0){

                    whiteTime=0;

                    timeExpired("Black");

                    return;
                }

            }else{

                blackTime--;

                if(blackTime<=0){

                    blackTime=0;

                    timeExpired("White");

                    return;
                }
            }

            updateClockUI();

        },1000);
}


function stopClock(){

    if(clockTimer){

        clearInterval(clockTimer);
        clockTimer=null;
    }
}


function timeExpired(winner){

    gameOver=true;

    stopClock();

    showGameOver(
        "⏱️",
        "Time Out!",
        winner+" wins on time."
    );

    playSound("game");
}


function formatTime(sec){

    const m=
        Math.floor(sec/60);

    const s=
        sec%60;

    return(
        String(m).padStart(2,"0")+
        ":"+
        String(s).padStart(2,"0")
    );
}


function updateClockUI(){

    const white=
        document.getElementById(
            "whiteClock"
        );

    const black=
        document.getElementById(
            "blackClock"
        );


    white.textContent=
        formatTime(whiteTime);

    black.textContent=
        formatTime(blackTime);


    white.classList.toggle(
        "active",
        turn==="w"
    );

    black.classList.toggle(
        "active",
        turn==="b"
    );


    white.classList.toggle(
        "danger",
        whiteTime<=20
    );

    black.classList.toggle(
        "danger",
        blackTime<=20
    );
}


/* =========================================================
   MOVE HISTORY
========================================================= */

function updateMoves(){

    const box=
        document.getElementById(
            "moves"
        );

    box.innerHTML="";


    for(
        let i=0;
        i<moves.length;
        i+=2
    ){

        const row=
            document.createElement("div");

        row.className="move-row";


        const num=
            document.createElement("span");

        num.className="num";

        num.textContent=
            (i/2+1)+".";


        const white=
            document.createElement("span");

        white.className="move-white";

        white.textContent=
            moves[i]
            ?moves[i].notation
            :"";


        const black=
            document.createElement("span");

        black.className="move-black";

        black.textContent=
            moves[i+1]
            ?moves[i+1].notation
            :"";


        row.append(
            num,
            white,
            black
        );

        box.appendChild(row);
    }


    document.getElementById(
        "moveCount"
    ).textContent=
        moves.length+
        (moves.length===1
        ?" move"
        :" moves");


    box.scrollTop=
        box.scrollHeight;
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const element=
        document.getElementById(
            "board"
        );

    element.innerHTML="";


    for(let displayR=0;displayR<8;displayR++){

        for(let displayC=0;displayC<8;displayC++){

            const r=
                flipped
                ?7-displayR
                :displayR;

            const c=
                flipped
                ?7-displayC
                :displayC;


            const square=
                document.createElement("div");

            square.className=
                "square "+
                ((r+c)%2===0
                ?"light"
                :"dark");


            if(
                selected &&
                selected.r===r &&
                selected.c===c
            ){

                square.classList.add(
                    "selected"
                );
            }


            if(
                lastMove &&
                (
                    (
                        lastMove.fr===r &&
                        lastMove.fc===c
                    ) ||
                    (
                        lastMove.tr===r &&
                        lastMove.tc===c
                    )
                )
            ){

                square.classList.add(
                    "last"
                );
            }


            if(
                inCheck(turn)
            ){

                const king=
                    findKing(turn);

                if(
                    king &&
                    king.r===r &&
                    king.c===c
                ){

                    square.classList.add(
                        "check"
                    );
                }
            }


            const target=
                targets.find(
                    m=>m.r===r&&m.c===c
                );


            if(target){

                if(board[r][c])
                    square.classList.add(
                        "capture"
                    );
                else
                    square.classList.add(
                        "target"
                    );
            }


            const p=board[r][c];


            if(p){

                const span=
                    document.createElement(
                        "span"
                    );

                span.className=
                    "piece "+
                    (
                        color(p)==="w"
                        ?"white-piece"
                        :"black-piece"
                    )+
                    (
                        lastMove &&
                        lastMove.tr===r &&
                        lastMove.tc===c
                        ?" animate"
                        :""
                    );

                span.textContent=
                    SYMBOLS[p];

                square.appendChild(span);
            }


            square.onclick=
                ()=>clickSquare(r,c);


            element.appendChild(square);
        }
    }
}

        );

            document.getElementById(
                "timeControl"
            ).value
        );


    increment=
        time===15
        ?10
        :0;


    whiteTime=time*60;
    blackTime=time*60;


    board=
        startingBoard();

    turn="w";

    selected=null;
    targets=[];

    gameOver=false;

    history=[];
    moves=[];

    lastMove=null;

    enPassant=null;


    castling={
        wK:true,
        wQ:true,
        bK:true,
        bQ:true
    };


    stopClock();

    closeModal();

    updateEverything();

    startClock();
}


/* =========================================================
   FLIP BOARD
========================================================= */

function flipBoard(){

    flipped=!flipped;

    render();
}


/* =========================================================
   RESIGN
========================================================= */

function resign(){

    if(gameOver)
        return;


    const winner=
        opposite(turn)==="w"
        ?"White"
        :"Black";


    gameOver=true;

    stopClock();


    showGameOver(
        "🏳️",
        "Game Resigned",
        winner+" wins by resignation."
    );

    playSound("game");
}


/* =========================================================
   UI UPDATE
========================================================= */

function updateEverything(){

    render();

    updateClockUI();

    updateMoves();

    updateStatus();
}


function updateStatus(){

    if(gameOver)
        return;


    const check=
        inCheck(turn);


    if(check){

        document.getElementById(
            "status"
        ).textContent=
            mode==="local"
            ?(
                turn==="w"
                ?"⚠️ White is in check!"
                :"⚠️ Black is in check!"
            )
            :(
                turn==="w"
                ?"⚠️ Check! Your king is attacked."
                :"⚠️ Computer is in check!"
            );

        return;
    }


    if(mode==="local"){

        document.getElementById(
            "status"
        ).textContent=
            turn==="w"
            ?"White to move"
            :"Black to move";

    }else{

        document.getElementById(
            "status"
        ).textContent=
            turn==="w"
            ?"Your turn — White"
            :"Computer's turn — Black";
    }
}


/* =========================================================
   MODALS
========================================================= */

function showGameOver(
    icon,
    title,
    text
){

    document.getElementById(
        "promotionButtons"
    ).innerHTML=
        `<div style="
            grid-column:1/-1;
            font-size:45px;
        ">${icon}</div>`;


    document.getElementById(
        "modalTitle"
    ).textContent=title;


    document.getElementById(
        "modalText"
    ).textContent=text;


    document.getElementById(
        "modalNewGame"
    ).style.display="block";


    document.getElementById(
        "modal"
    ).classList.add("show");
}


function closeModal(){

    document.getElementById(
        "modal"
    ).classList.remove("show");

    pendingPromotion=null;
}


/* =========================================================
   SOUND
========================================================= */

function initAudio(){

    if(!audio){

        audio=
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }


    if(audio.state==="suspended")
        audio.resume();
}


function playSound(type){

    if(!soundOn)
        return;


    initAudio();


    const osc=
        audio.createOscillator();

    const gain=
        audio.createGain();


    osc.connect(gain);
    gain.connect(audio.destination);


    let frequency=420;
    let duration=.07;


    if(type==="capture"){

        frequency=250;
        duration=.12;

    }else if(type==="castle"){

        frequency=520;
        duration=.12;

    }else if(type==="check"){

        frequency=650;
        duration=.18;

    }else if(type==="game"){

        frequency=760;
        duration=.3;
    }


    osc.frequency.value=
        frequency;

    osc.type="sine";


    gain.gain.setValueAtTime(
        .0001,
        audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .08,
        audio.currentTime+.01
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audio.currentTime+duration
    );


    osc.start();

    osc.stop(
        audio.currentTime+duration
    );
}


function toggleSound(){

    soundOn=!soundOn;

    document.getElementById(
        "soundBtn"
    ).textContent=
        soundOn
        ?"🔊"
        :"🔇";


    if(soundOn)
        playSound("move");
}
