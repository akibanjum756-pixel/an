<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>Royal Chess ♟</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#080b12;
    --panel:rgba(20,25,36,.78);
    --panel2:rgba(255,255,255,.055);
    --text:#f5f7fb;
    --muted:#8e98aa;
    --accent:#8b5cf6;
    --accent2:#ec4899;

    --light:#ead7b7;
    --dark:#9b6f4a;

    --green:#39d98a;
    --red:#ff5570;
    --gold:#ffd166;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:
        radial-gradient(circle at 10% 0%,
        rgba(139,92,246,.22),transparent 32%),
        radial-gradient(circle at 90% 10%,
        rgba(236,72,153,.16),transparent 30%),
        #080b12;
    color:var(--text);
    font-family:
        Inter,system-ui,-apple-system,
        BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
}

button,select{
    font:inherit;
}

button{
    border:0;
    color:white;
    cursor:pointer;
}

.app{
    width:min(1100px,100%);
    padding:18px 14px 30px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:44px;
    height:44px;
    border-radius:14px;
    display:grid;
    place-items:center;
    font-size:25px;
    background:
        linear-gradient(135deg,
        rgba(139,92,246,.9),
        rgba(236,72,153,.9));
    box-shadow:0 8px 25px rgba(139,92,246,.3);
}

.logo h1{
    font-size:21px;
    margin:0;
}

.logo p{
    margin:2px 0 0;
    font-size:11px;
    color:var(--muted);
}

.icon-btn{
    width:43px;
    height:43px;
    border-radius:13px;
    background:var(--panel2);
    border:1px solid rgba(255,255,255,.08);
    font-size:18px;
}

/* LAYOUT */

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 300px;
    gap:18px;
}

.left{
    min-width:0;
}

.right{
    display:flex;
    flex-direction:column;
    gap:13px;
}

/* BOARD AREA */

.board-wrap{
    position:relative;
    width:min(92vw,700px);
    margin:auto;
    padding:9px;
    border-radius:22px;
    background:
        linear-gradient(145deg,
        rgba(255,255,255,.10),
        rgba(255,255,255,.025));
    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.1);
}

.board{
    position:relative;
    width:100%;
    aspect-ratio:1;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    overflow:hidden;
    border-radius:15px;
    touch-action:none;
}

.square{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
    cursor:pointer;
    overflow:hidden;
}

.light{
    background:var(--light);
}

.dark{
    background:var(--dark);
}

.square::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    transition:.15s;
}

.square.selected::after{
    box-shadow:inset 0 0 0 4px var(--gold);
}

.square.last::after{
    background:rgba(255,215,80,.17);
}

.square.check::after{
    background:
        radial-gradient(circle,
        rgba(255,45,75,.8),
        rgba(255,45,75,.25) 55%,
        transparent 75%);
}

.square.move-target::before{
    content:"";
    position:absolute;
    width:25%;
    aspect-ratio:1;
    border-radius:50%;
    background:rgba(20,20,20,.25);
    z-index:2;
}

.square.capture-target::before{
    content:"";
    position:absolute;
    inset:8%;
    border-radius:50%;
    border:5px solid rgba(255,70,80,.65);
    z-index:2;
}

.piece{
    position:relative;
    z-index:3;
    font-family:
        "Arial Unicode MS",
        "Segoe UI Symbol",
        sans-serif;
    font-size:clamp(32px,8.8vw,74px);
    line-height:1;
    user-select:none;

    transition:
        transform .15s ease,
        filter .15s ease;
}

.square:active .piece{
    transform:scale(.91);
}

.white-piece{
    color:#fffaf0;
    text-shadow:
        0 2px 2px rgba(0,0,0,.7),
        0 4px 8px rgba(0,0,0,.35);
}

.black-piece{
    color:#181818;
    text-shadow:
        0 1px 1px rgba(255,255,255,.35),
        0 4px 8px rgba(0,0,0,.45);
}

/* ANIMATION */

@keyframes pieceIn{
    0%{
        transform:scale(.65);
        opacity:.2;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

.animate-piece{
    animation:pieceIn .18s ease-out;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.035)}
}

.check-pulse{
    animation:pulse .65s infinite;
}

/* PLAYERS */

.player-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px 13px;
    margin-bottom:10px;
    border-radius:15px;
    background:var(--panel);
    border:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(16px);
}

.player{
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:37px;
    height:37px;
    border-radius:11px;
    display:grid;
    place-items:center;
    background:rgba(255,255,255,.08);
}

.player-name{
    font-size:13px;
    font-weight:700;
}

.player-color{
    font-size:10px;
    color:var(--muted);
    margin-top:2px;
}

.clock{
    min-width:83px;
    padding:7px 10px;
    text-align:center;
    border-radius:10px;
    background:rgba(0,0,0,.28);
    font-size:20px;
    font-weight:800;
    letter-spacing:1px;
}

.clock.active{
    background:
        linear-gradient(135deg,
        rgba(139,92,246,.4),
        rgba(236,72,153,.25));
    box-shadow:
        0 0 20px rgba(139,92,246,.18);
}

.clock.danger{
    color:#ff647a;
    animation:pulse .7s infinite;
}

/* PANELS */

.panel{
    background:var(--panel);
    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;
    padding:14px;
    backdrop-filter:blur(18px);
    box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.panel-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.panel-title strong{
    font-size:13px;
}

.badge{
    padding:4px 8px;
    border-radius:8px;
    font-size:10px;
    color:#c4b5fd;
    background:rgba(139,92,246,.13);
}

/* STATUS */

.status{
    text-align:center;
    padding:11px;
    border-radius:13px;
    background:rgba(255,255,255,.045);
    font-size:13px;
    font-weight:700;
}

/* MOVES */

.moves{
    height:250px;
    overflow:auto;
    scrollbar-width:thin;
}

.move-row{
    display:grid;
    grid-template-columns:30px 1fr 1fr;
    padding:6px 4px;
    border-radius:8px;
    font-size:12px;
}

.move-row:nth-child(odd){
    background:rgba(255,255,255,.025);
}

.move-number{
    color:var(--muted);
}

.move-white,
.move-black{
    font-weight:600;
}

/* CONTROLS */

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.btn{
    padding:11px;
    border-radius:12px;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.07);
    font-size:12px;
    font-weight:700;
    transition:.15s;
}

.btn:active{
    transform:scale(.96);
}

.btn.primary{
    background:
        linear-gradient(135deg,
        #7c3aed,#db2777);
}

/* SETTINGS */

.setting{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 0;
}

.setting span{
    font-size:12px;
    color:#cbd0db;
}

select{
    color:white;
    background:#181d28;
    border:1px solid rgba(255,255,255,.1);
    border-radius:9px;
    padding:7px 9px;
    outline:none;
    font-size:11px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(12px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(420px,100%);
    padding:24px;
    border-radius:24px;
    background:#141923;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 30px 100px rgba(0,0,0,.7);
    text-align:center;
}

.modal-icon{
    font-size:50px;
    margin-bottom:8px;
}

.modal h2{
    margin:5px 0;
}

.modal p{
    color:var(--muted);
    font-size:13px;
}

.modal-buttons{
    display:flex;
    gap:9px;
    margin-top:18px;
}

.modal-buttons button{
    flex:1;
    padding:12px;
    border-radius:12px;
    background:rgba(255,255,255,.08);
}

.modal-buttons .primary{
    background:linear-gradient(135deg,#7c3aed,#db2777);
}

/* MOBILE */

@media(max-width:850px){

    .app{
        padding:10px 8px 25px;
    }

    .layout{
        display:block;
    }

    .right{
        margin-top:12px;
    }

    .board-wrap{
        width:min(96vw,650px);
        padding:6px;
        border-radius:17px;
    }

    .piece{
        font-size:clamp(29px,10.5vw,65px);
    }

    .panel.moves-panel{
        display:none;
    }

    .settings-panel{
        order:3;
    }

    .controls{
        grid-template-columns:1fr 1fr;
    }

    .header{
        margin-bottom:8px;
    }
}

@media(min-width:851px){

    .mobile-status{
        display:none;
    }
}

::-webkit-scrollbar{
    width:4px;
}

::-webkit-scrollbar-thumb{
    background:#454b5a;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="logo">

            <div class="logo-icon">♛</div>

            <div>
                <h1>Royal Chess</h1>
                <p>Premium Chess Experience</p>
            </div>

        </div>

        <button class="icon-btn"
                onclick="toggleSound()"
                id="soundButton">
            🔊
        </button>

    </header>


    <div class="layout">

        <main class="left">

            <!-- BLACK PLAYER -->

            <div class="player-card">

                <div class="player">

                    <div class="avatar">🤖</div>

                    <div>
                        <div class="player-name">
                            Computer
                        </div>

                        <div class="player-color">
                            Black
                        </div>
                    </div>

                </div>

                <div class="clock"
                     id="blackClock">
                    10:00
                </div>

            </div>


            <!-- BOARD -->

            <div class="board-wrap">

                <div class="board"
                     id="board">
                </div>

            </div>


            <!-- WHITE PLAYER -->

            <div class="player-card">

                <div class="player">

                    <div class="avatar">♙</div>

                    <div>
                        <div class="player-name">
                            You
                        </div>

                        <div class="player-color">
                            White
                        </div>
                    </div>

                </div>

                <div class="clock active"
                     id="whiteClock">
                    10:00
                </div>

            </div>


            <div class="status"
                 id="status">
                Your turn — White
            </div>

        </main>


        <aside class="right">

            <!-- GAME SETTINGS -->

            <div class="panel settings-panel">

                <div class="panel-title">

                    <strong>Game Settings</strong>

                    <span class="badge">
                        LIVE
                    </span>

                </div>


                <div class="setting">

                    <span>Difficulty</span>

                    <select id="difficulty">

                        <option value="1">
                            Easy
                        </option>

                        <option value="2"
                                selected>
                            Medium
                        </option>

                        <option value="3">
                            Hard
                        </option>

                    </select>

                </div>


                <div class="setting">

                    <span>Time Control</span>

                    <select id="timeControl">

                        <option value="1">
                            1 + 0
                        </option>

                        <option value="3">
                            3 + 0
                        </option>

                        <option value="5">
                            5 + 0
                        </option>

                        <option value="10"
                                selected>
                            10 + 0
                        </option>

                        <option value="15">
                            15 + 10
                        </option>

                    </select>

                </div>

            </div>


            <!-- CONTROLS -->

            <div class="panel">

                <div class="controls">

                    <button class="btn primary"
                            onclick="newGame()">
                        ♟ New Game
                    </button>

                    <button class="btn"
                            onclick="undo()">
                        ↩ Undo
                    </button>

                </div>

            </div>


            <!-- MOVES -->

            <div class="panel moves-panel">

                <div class="panel-title">

                    <strong>Move History</strong>

                    <span class="badge"
                          id="moveCount">
                        0 moves
                    </span>

                </div>

                <div class="moves"
                     id="moves">
                </div>

            </div>

        </aside>

    </div>

</div>


<!-- GAME OVER MODAL -->

<div class="modal"
     id="modal">

    <div class="modal-box">

        <div class="modal-icon"
             id="modalIcon">
            ♛
        </div>

        <h2 id="modalTitle">
            Checkmate
        </h2>

        <p id="modalText">
            Game over.
        </p>

        <div class="modal-buttons">

            <button onclick="closeModal()">
                Close
            </button>

            <button class="primary"
                    onclick="newGame();closeModal()">
                New Game
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   ROYAL CHESS
   Complete chess rules + AI + clock + sounds
========================================================= */


/* ---------- PIECES ---------- */

const PIECES={

    wK:"♔",
    wQ:"♕",
    wR:"♖",
    wB:"♗",
    wN:"♘",
    wP:"♙",

    bK:"♚",
    bQ:"♛",
    bR:"♜",
    bB:"♝",
    bN:"♞",
    bP:"♟"

};


/* ---------- GAME STATE ---------- */

let board;

let turn="w";

let selected=null;

let legalTargets=[];

let gameOver=false;

let soundEnabled=true;

let history=[];

let moveHistory=[];

let enPassant=null;

let castling={
    wK:true,
    wQ:true,
    bK:true,
    bQ:true
};


/* ---------- CLOCK ---------- */

let baseMinutes=10;

let increment=0;

let whiteTime=600;

let blackTime=600;

let clockInterval=null;


/* ---------- AUDIO ---------- */

let audioContext=null;

function initAudio(){

    if(!audioContext){

        audioContext=
            new (window.AudioContext ||
            window.webkitAudioContext)();

    }

    if(audioContext.state==="suspended")
        audioContext.resume();
}


function sound(type){

    if(!soundEnabled)
        return;

    initAudio();

    const osc=
        audioContext.createOscillator();

    const gain=
        audioContext.createGain();

    osc.connect(gain);
    gain.connect(audioContext.destination);

    let freq=420;
    let duration=.08;

    if(type==="move"){
        freq=420;
        duration=.07;
    }

    if(type==="capture"){
        freq=250;
        duration=.11;
    }

    if(type==="check"){
        freq=650;
        duration=.18;
    }

    if(type==="castle"){
        freq=520;
        duration=.12;
    }

    if(type==="game"){
        freq=750;
        duration=.3;
    }

    osc.frequency.value=freq;
    osc.type="sine";

    gain.gain.setValueAtTime(
        .0001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .08,
        audioContext.currentTime+.01
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioContext.currentTime+duration
    );

    osc.start();

    osc.stop(
        audioContext.currentTime+duration
    );
}


function toggleSound(){

    soundEnabled=!soundEnabled;

    document.getElementById("soundButton")
        .textContent=
        soundEnabled?"🔊":"🔇";

    if(soundEnabled)
        sound("move");
}


/* ---------- INITIAL BOARD ---------- */

function initialBoard(){

    return [

        ["bR","bN","bB","bQ","bK","bB","bN","bR"],

        ["bP","bP","bP","bP","bP","bP","bP","bP"],

        [null,null,null,null,null,null,null,null],

        [null,null,null,null,null,null,null,null],

        [null,null,null,null,null,null,null,null],

        [null,null,null,null,null,null,null,null],

        ["wP","wP","wP","wP","wP","wP","wP","wP"],

        ["wR","wN","wB","wQ","wK","wB","wN","wR"]

    ];

}


/* ---------- HELPERS ---------- */

function cloneBoard(b){

    return b.map(row=>row.slice());

}


function inside(r,c){

    return r>=0 &&
           r<8 &&
           c>=0 &&
           c<8;

}


function color(piece){

    return piece ? piece[0] : null;

}


function type(piece){

    return piece ? piece[1] : null;

}


/* ---------- RENDER ---------- */

function render(){

    const boardElement=
        document.getElementById("board");

    boardElement.innerHTML="";

    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            const sq=
                document.createElement("div");

            sq.className=
                "square "+
                ((r+c)%2===0?
                "light":"dark");

            if(selected &&
               selected.r===r &&
               selected.c===c){

                sq.classList.add("selected");

            }

            if(lastMove &&
               (
                (lastMove.fr===r &&
                 lastMove.fc===c) ||

                (lastMove.tr===r &&
                 lastMove.tc===c)
               )){

                sq.classList.add("last");

            }

            if(isKingInCheck(turn)){

                const king=findKing(turn);

                if(king &&
                   king.r===r &&
                   king.c===c){

                    sq.classList.add("check");
                }
            }

            const target=
                legalTargets.find(
                    m=>m.r===r && m.c===c
                );

            if(target){

                if(board[r][c])
                    sq.classList.add("capture-target");
                else
                    sq.classList.add("move-target");

            }

            const piece=board[r][c];

            if(piece){

                const span=
                    document.createElement("span");

                span.className=
                    "piece "+
                    (color(piece)==="w"
                     ?"white-piece"
                     :"black-piece");

                span.textContent=PIECES[piece];

                sq.appendChild(span);

            }

            sq.addEventListener(
                "click",
                ()=>handleSquare(r,c)
            );

            boardElement.appendChild(sq);

        }
    }

}


/* ---------- SQUARE CLICK ---------- */

function handleSquare(r,c){

    initAudio();

    if(gameOver || turn!=="w")
        return;

    const piece=board[r][c];

    if(selected){

        const move=
            legalTargets.find(
                m=>m.r===r && m.c===c
            );

        if(move){

            performMove(
                selected.r,
                selected.c,
                r,
                c
            );

            selected=null;
            legalTargets=[];

            render();

            if(!gameOver){

                setTimeout(
                    computerMove,
                    250
                );

            }

            return;
        }

        if(piece &&
           color(piece)==="w"){

            selected={r,c};

            legalTargets=
                getLegalMoves(r,c);

            render();

            return;
        }

        selected=null;
        legalTargets=[];

        render();

        return;
    }

    if(piece &&
       color(piece)==="w"){

        selected={r,c};

        legalTargets=
            getLegalMoves(r,c);

        render();
    }

}


/* =========================================================
   MOVE GENERATION
========================================================= */

function pseudoMoves(r,c,b=board){

    const piece=b[r][c];

    if(!piece)
        return [];

    const col=color(piece);

    const t=type(piece);

    const moves=[];


    function add(nr,nc){

        if(!inside(nr,nc))
            return;

        if(!b[nr][nc] ||
           color(b[nr][nc])!==col){

            moves.push({
                r:nr,
                c:nc
            });

        }

    }


    /* PAWN */

    if(t==="P"){

        const dir=
            col==="w"?-1:1;

        const start=
            col==="w"?6:1;

        if(
            inside(r+dir,c) &&
            !b[r+dir][c]
        ){

            moves.push({
                r:r+dir,
                c:c
            });

            if(
                r===start &&
                !b[r+2*dir][c]
            ){

                moves.push({
                    r:r+2*dir,
                    c:c
                });

            }

        }


        for(const dc of [-1,1]){

            const nr=r+dir;
            const nc=c+dc;

            if(
                inside(nr,nc) &&
                b[nr][nc] &&
                color(b[nr][nc])!==col
            ){

                moves.push({
                    r:nr,
                    c:nc
                });

            }


            /* EN PASSANT */

            if(
                enPassant &&
                enPassant.r===nr &&
                enPassant.c===nc
            ){

                moves.push({
                    r:nr,
                    c:nc,
                    enPassant:true
                });

            }

        }

    }


    /* KNIGHT */

    if(t==="N"){

        const dirs=[

            [-2,-1],
            [-2,1],
            [-1,-2],
            [-1,2],
            [1,-2],
            [1,2],
            [2,-1],
            [2,1]

        ];

        dirs.forEach(
            ([dr,dc])=>
            add(r+dr,c+dc)
        );

    }


    /* KING */

    if(t==="K"){

        for(let dr=-1;dr<=1;dr++){

            for(let dc=-1;dc<=1;dc++){

                if(dr||dc)
                    add(r+dr,c+dc);

            }

        }


        /* CASTLING */

        if(!isKingInCheck(col,b)){

            if(
                col==="w" &&
                r===7 &&
                c===4
            ){

                if(
                    castling.wK &&
                    b[7][5]===null &&
                    b[7][6]===null &&
                    b[7][7]==="wR" &&
                    !squareAttacked(
                        7,5,"b",b
                    ) &&
                    !squareAttacked(
                        7,6,"b",b
                    )
                ){

                    moves.push({
                        r:7,
                        c:6,
                        castle:"K"
                    });

                }


                if(
                    castling.wQ &&
                    b[7][1]===null &&
                    b[7][2]===null &&
                    b[7][3]===null &&
                    b[7][0]==="wR" &&
                    !squareAttacked(
                        7,3,"b",b
                    ) &&
                    !squareAttacked(
                        7,2,"b",b
                    )
                ){

                    moves.push({
                        r:7,
                        c:2,
                        castle:"Q"
                    });

                }

            }


            if(
                col==="b" &&
                r===0 &&
                c===4
            ){

                if(
                    castling.bK &&
                    b[0][5]===null &&
                    b[0][6]===null &&
                    b[0][7]==="bR" &&
                    !squareAttacked(
                        0,5,"w",b
                    ) &&
                    !squareAttacked(
                        0,6,"w",b
                    )
                ){

                    moves.push({
                        r:0,
                        c:6,
                        castle:"K"
                    });

                }


                if(
                    castling.bQ &&
                    b[0][1]===null &&
                    b[0][2]===null &&
                    b[0][3]===null &&
                    b[0][0]==="bR" &&
                    !squareAttacked(
                        0,3,"w",b
                    ) &&
                    !squareAttacked(
                        0,2,"w",b
                    )
                ){

                    moves.push({
                        r:0,
                        c:2,
                        castle:"Q"
                    });

                }

            }

        }

    }


    /* ROOK / BISHOP / QUEEN */

    if(
        t==="R" ||
        t==="B" ||
        t==="Q"
    ){

        const dirs=[];

        if(
            t==="R" ||
            t==="Q"
        ){

            dirs.push(
                [1,0],
                [-1,0],
                [0,1],
                [0,-1]
            );

        }

        if(
            t==="B" ||
            t==="Q"
        ){

            dirs.push(
                [1,1],
                [1,-1],
                [-1,1],
                [-1,-1]
            );

        }

        for(
            const [dr,dc] of dirs
        ){

            let nr=r+dr;
            let nc=c+dc;

            while(
                inside(nr,nc)
            ){

                if(!b[nr][nc]){

                    moves.push({
                        r:nr,
                        c:nc
                    });

                }else{

                    if(
                        color(b[nr][nc])!==col
                    ){

                        moves.push({
                            r:nr,
                            c:nc
                        });

                    }

                    break;
                }

                nr+=dr;
                nc+=dc;
            }

        }

    }

    return moves;

}


/* ---------- KING LOCATION ---------- */

function findKing(col,b=board){

    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            if(b[r][c]===col+"K")
                return {r,c};

        }

    }

    return null;
}


/* ---------- ATTACK DETECTION ---------- */

function squareAttacked(r,c,byColor,b=board){

    for(let rr=0;rr<8;rr++){

        for(let cc=0;cc<8;cc++){

            const piece=b[rr][cc];

            if(
                !piece ||
                color(piece)!==byColor
            )
                continue;

            const t=type(piece);


            /* PAWN */

            if(t==="P"){

                const dir=
                    byColor==="w"?-1:1;

                if(
                    rr+dir===r &&
                    Math.abs(cc-c)===1
                )
                    return true;

                continue;
            }


            /* KING */

            if(t==="K"){

                if(
                    Math.abs(rr-r)<=1 &&
                    Math.abs(cc-c)<=1
                )
                    return true;

                continue;
            }


            const moves=
                pseudoMovesWithoutSpecial(
                    rr,cc,b
                );

            if(
                moves.some(
                    m=>m.r===r &&
                       m.c===c
                )
            )
                return true;

        }

    }

    return false;

}


/* Avoid recursive castling/EP checks */

function pseudoMovesWithoutSpecial(r,c,b){

    const piece=b[r][c];

    if(!piece)
        return [];

    const col=color(piece);
    const t=type(piece);

    const moves=[];

    function add(nr,nc){

        if(!inside(nr,nc))
            return;

        if(
            !b[nr][nc] ||
            color(b[nr][nc])!==col
        ){

            moves.push({
                r:nr,
                c:nc
            });

        }

    }


    if(t==="N"){

        [
            [-2,-1],[-2,1],
            [-1,-2],[-1,2],
            [1,-2],[1,2],
            [2,-1],[2,1]
        ].forEach(
            ([dr,dc])=>
            add(r+dr,c+dc)
        );

    }


    if(
        t==="R" ||
        t==="B" ||
        t==="Q"
    ){

        const dirs=[];

        if(
            t==="R" ||
            t==="Q"
        )
            dirs.push(
                [1,0],
                [-1,0],
                [0,1],
                [0,-1]
            );

        if(
            t==="B" ||
            t==="Q"
        )
            dirs.push(
                [1,1],
                [1,-1],
                [-1,1],
                [-1,-1]
            );

        for(
            const [dr,dc] of dirs
        ){

            let nr=r+dr;
            let nc=c+dc;

            while(
                inside(nr,nc)
            ){

                if(!b[nr][nc]){

                    moves.push({
                        r:nr,
                        c:nc
                    });

                }else{

                    if(
                        color(b[nr][nc])!==col
                    ){

                        moves.push({
                            r:nr,
                            c:nc
                        });

                    }

                    break;
                }

                nr+=dr;
                nc+=dc;

            }

        }

    }

    return moves;

}


/* ---------- CHECK ---------- */

function isKingInCheck(col,b=board){

    const king=findKing(col,b);

    if(!king)
        return true;

    return squareAttacked(
        king.r,
        king.c,
        col==="w"?"b":"w",
        b
    );

}


/* ---------- LEGAL MOVES ---------- */

function getLegalMoves(r,c){

    const piece=board[r][c];

    if(!piece)
        return [];

    const col=color(piece);

    const pseudo=
        pseudoMoves(r,c,board);

    const legal=[];

    for(const move of pseudo){

        const test=
            cloneBoard(board);

        test[move.r][move.c]=
            test[r][c];

        test[r][c]=null;


        /* en passant */

        if(move.enPassant){

            const capturedRow=
                move.r+(col==="w"?1:-1);

            test[capturedRow][move.c]=null;

        }


        /* castle rook */

        if(move.castle){

            if(move.c===6){

                test[move.r][5]=
                    test[move.r][7];

                test[move.r][7]=null;

            }else{

                test[move.r][3]=
                    test[move.r][0];

                test[move.r][0]=null;

            }

        }


        if(!isKingInCheck(col,test))
            legal.push(move);

    }

    return legal;

}


/* ---------- ALL LEGAL MOVES ---------- */

function allLegalMoves(col,b=board){

    const result=[];

    const oldBoard=board;

    board=b;

    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            if(
                board[r][c] &&
                color(board[r][c])===col
            ){

                const moves=
                    getLegalMoves(r,c);

                for(const m of moves){

                    result.push({
                        fr:r,
                        fc:c,
                        r:m.r,
                        c:m.c,
                        castle:m.castle,
                        enPassant:m.enPassant
                    });

                }

            }

        }

    }

    board=oldBoard;

    return result;

}


/* =========================================================
   EXECUTE MOVE
========================================================= */

let lastMove=null;

function performMove(fr,fc,tr,tc){

    const piece=board[fr][fc];

    const col=color(piece);

    const legal=
        getLegalMoves(fr,fc);

    const move=
        legal.find(
            m=>m.r===tr &&
               m.c===tc
        );

    if(!move)
        return;


    /* SAVE HISTORY */

    history.push({

        board:cloneBoard(board),

        turn,

        castling:{...castling},

        enPassant,
        whiteTime,
        blackTime,

        moveHistory:
            [...moveHistory],

        lastMove

    });


    const captured=
        board[tr][tc];


    board[tr][tc]=piece;
    board[fr][fc]=null;


    /* EN PASSANT */

    if(move.enPassant){

        const capturedRow=
            tr+(col==="w"?1:-1);

        board[capturedRow][tc]=null;

    }


    /* CASTLING */

    if(move.castle){

        if(tc===6){

            board[tr][5]=
                board[tr][7];

            board[tr][7]=null;

        }

        if(tc===2){

            board[tr][3]=
                board[tr][0];

            board[tr][0]=null;

        }

    }


    /* UPDATE CASTLING RIGHTS */

    if(piece==="wK"){

        castling.wK=false;
        castling.wQ=false;

    }

    if(piece==="bK"){

        castling.bK=false;
        castling.bQ=false;

    }


    if(piece==="wR" && fr===7 && fc===0)
        castling.wQ=false;

    if(piece==="wR" && fr===7 && fc===7)
        castling.wK=false;

    if(piece==="bR" && fr===0 && fc===0)
        castling.bQ=false;

    if(piece==="bR" && fr===0 && fc===7)
        castling.bK=false;


    /* Captured rook */

    if(captured==="wR"){

        if(tr===7 && tc===0)
            castling.wQ=false;

        if(tr===7 && tc===7)
            castling.wK=false;

    }

    if(captured==="bR"){

        if(tr===0 && tc===0)
            castling.bQ=false;

        if(tr===0 && tc===7)
            castling.bK=false;

    }


    /* EN PASSANT TARGET */

    enPassant=null;

    if(
        type(piece)==="P" &&
        Math.abs(tr-fr)===2
    ){

        enPassant={

            r:(tr+fr)/2,
            c:fc

        };

    }


    /* PROMOTION */

    if(
        piece==="wP" &&
        tr===0
    ){

        board[tr][tc]="wQ";

    }

    if(
        piece==="bP" &&
        tr===7
    ){

        board[tr][tc]="bQ";

    }


    /* MOVE NOTATION */

    let notation="";

    if(move.castle){

        notation=
            tc===6
            ?"O-O"
            :"O-O-O";

    }else{

        notation=
            squareName(fr,fc)+
            (captured||move.enPassant?"x":"-")+
            squareName(tr,tc);

        if(
            piece==="wP" &&
            tr===0
        )
            notation+="=Q";

        if(
            piece==="bP" &&
            tr===7
        )
            notation+="=Q";

    }


    moveHistory.push({

        color:col,
        notation

    });


    lastMove={
        fr,fc,tr,tc
    };


    turn=
        turn==="w"
        ?"b"
        :"w";


    if(col==="w"){

        whiteTime+=increment;

    }else{

        blackTime+=increment;

    }


    updateMoveList();

    startClock();

    if(captured || move.enPassant)
        sound("capture");
    else if(move.castle)
        sound("castle");
    else
        sound("move");


    checkGameState();

}


/* ---------- SQUARE NAME ---------- */

function squareName(r,c){

    return "abcdefgh"[c]+(8-r);

}


/* =========================================================
   GAME STATE
========================================================= */

function checkGameState(){

    const moves=
        allLegalMoves(turn);

    const check=
        isKingInCheck(turn);

    if(check)
        sound("check");


    if(moves.length===0){

        gameOver=true;

        stopClock();

        if(check){

            const winner=
                turn==="w"
                ?"Black"
                :"White";

            showGameOver(
                "♚",
                "Checkmate!",
                winner+" wins the game."
            );

            sound("game");

        }else{

            showGameOver(
                "🤝",
                "Stalemate",
                "The game ends in a draw."
            );

        }

        return;

    }


    if(check){

        document.getElementById("status")
            .textContent=
            turn==="w"
            ?"⚠️ Check! Your king is under attack."
            :"⚠️ Computer is in check!";

    }else{

        document.getElementById("status")
            .textContent=
            turn==="w"
            ?"Your turn — White"
            :"Computer is thinking…";

    }

    render();

}


/* =========================================================
   CHESS CLOCK
========================================================= */

function startClock(){

    stopClock();

    clockInterval=
        setInterval(()=>{

            if(gameOver)
                return;

            if(turn==="w"){

                whiteTime--;

                if(whiteTime<=0){

                    whiteTime=0;

                    timeOut("Black");

                    return;

                }

            }else{

                blackTime--;

                if(blackTime<=0){

                    blackTime=0;

                    timeOut("White");

                    return;

                }

            }

            updateClocks();

        },1000);

}


function stopClock(){

    if(clockInterval){

        clearInterval(clockInterval);

        clockInterval=null;

    }

}


function updateClocks(){

    const white=
        document.getElementById(
            "whiteClock"
        );

    const black=
        document.getElementById(
            "blackClock"
        );

    white.textContent=
        formatTime(whiteTime);

    black.textContent=
        formatTime(blackTime);


    white.classList.toggle(
        "active",
        turn==="w"
    );

    black.classList.toggle(
        "active",
        turn==="b"
    );


    white.classList.toggle(
        "danger",
        whiteTime<=20
    );

    black.classList.toggle(
        "danger",
        blackTime<=20
    );

}


function formatTime(seconds){

    const min=
        Math.floor(seconds/60);

    const sec=
        seconds%60;

    return (
        String(min).padStart(2,"0")+
        ":"+
        String(sec).padStart(2,"0")
    );

}


function timeOut(winner){

    gameOver=true;

    stopClock();

    showGameOver(
        "⏱️",
        "Time Out!",
        winner+" wins on time."
    );

    sound("game");

}


/* =========================================================
   AI
========================================================= */

const pieceValue={

    P:100,
    N:320,
    B:330,
    R:500,
    Q:900,
    K:20000

};


function evaluate(b){

    let score=0;

    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            const p=b[r][c];

            if(!p)
                continue;

            const value=
                pieceValue[type(p)];

            score+=
                color(p)==="b"
                ?value
                :-value;

        }

    }

    return score;

}


/* ---------- AI MOVE ---------- */

function computerMove(){

    if(gameOver || turn!=="b")
        return;


    const difficulty=
        Number(
            document.getElementById(
                "difficulty"
            ).value
        );


    const depth=
        difficulty===1
        ?1
        :difficulty===2
        ?2
        :3;


    const moves=
        allLegalMoves("b");


    if(!moves.length)
        return;


    let bestMove=moves[0];

    let bestScore=-Infinity;


    /* Easy */

    if(depth===1){

        bestMove=
            moves[
                Math.floor(
                    Math.random()*moves.length
                )
            ];

    }else{

        for(const move of moves){

            const test=
                cloneBoard(board);

            applyMoveToBoard(
                test,
                move,
                "b"
            );

            const score=
                minimax(
                    test,
                    depth-1,
                    false,
                    -Infinity,
                    Infinity
                );

            if(score>bestScore){

                bestScore=score;
                bestMove=move;

            }

        }

    }


    performMove(
        bestMove.fr,
        bestMove.fc,
        bestMove.r,
        bestMove.c
    );

    render();

}


function applyMoveToBoard(b,move,col){

    const piece=
        b[move.fr][move.fc];

    b[move.r][move.c]=piece;
    b[move.fr][move.fc]=null;


    if(move.enPassant){

        const row=
            move.r+
            (col==="w"?1:-1);

        b[row][move.c]=null;

    }


    if(move.castle){

        if(move.c===6){

            b[move.r][5]=
                b[move.r][7];

            b[move.r][7]=null;

        }else{

            b[move.r][3]=
                b[move.r][0];

            b[move.r][0]=null;

        }

    }


    if(
        piece==="bP" &&
        move.r===7
    )
        b[move.r][move.c]="bQ";

}


function minimax(
    b,
    depth,
    maximizing,
    alpha,
    beta
){

    if(depth===0)
        return evaluate(b);


    const col=
        maximizing?"b":"w";


    const moves=
        allLegalMoves(col,b);


    if(!moves.length){

        if(isKingInCheck(col,b)){

            return maximizing
                ?-100000
                :100000;

        }

        return 0;

    }


    if(maximizing){

        let max=-Infinity;

        for(const move of moves){

            const test=
                cloneBoard(b);

            applyMoveToBoard(
                test,
                move,
                col
            );

            const score=
                minimax(
                    test,
                    depth-1,
                    false,
                    alpha,
                    beta
                );

            max=Math.max(
                max,
                score
            );

            alpha=Math.max(
                alpha,
                score
            );

            if(beta<=alpha)
                break;

        }

        return max;

    }else{

        let min=Infinity;

        for(const move of moves){

            const test=
                cloneBoard(b);

            applyMoveToBoard(
                test,
                move,
                col
            );

            const score=
                minimax(
                    test,
                    depth-1,
                    true,
                    alpha,
                    beta
                );

            min=Math.min(
                min,
                score
            );

            beta=Math.min(
                beta,
                score
            );

            if(beta<=alpha)
                break;

        }

        return min;

    }

}


/* =========================================================
   MOVE HISTORY
========================================================= */

function updateMoveList(){

    const element=
        document.getElementById("moves");

    element.innerHTML="";

    for(
        let i=0;
        i<moveHistory.length;
        i+=2
    ){

        const row=
            document.createElement("div");

        row.className="move-row";

        const number=
            document.createElement("span");

        number.className="move-number";

        number.textContent=
            (i/2+1)+".";

        const white=
            document.createElement("span");

        white.className="move-white";

        white.textContent=
            moveHistory[i]
            ?moveHistory[i].notation
            :"";

        const black=
            document.createElement("span");

        black.className="move-black";

        black.textContent=
            moveHistory[i+1]
            ?moveHistory[i+1].notation
            :"";

        row.append(
            number,
            white,
            black
        );

        element.appendChild(row);

    }


    document.getElementById(
        "moveCount"
    ).textContent=
        moveHistory.length+
        (moveHistory.length===1
         ?" move"
         :" moves");


    element.scrollTop=
        element.scrollHeight;

}


/* =========================================================
   UNDO
========================================================= */

function undo(){

    if(!history.length ||
       gameOver)
        return;


    /* Undo computer move */

    let state=
        history.pop();


    board=state.board;
    turn=state.turn;
    castling=state.castling;
    enPassant=state.enPassant;

    whiteTime=state.whiteTime;
    blackTime=state.blackTime;

    moveHistory=
        state.moveHistory;

    lastMove=
        state.lastMove;


    /* If we're back on black,
       undo one more move */

    if(turn==="b" &&
       history.length){

        state=
            history.pop();

        board=state.board;
        turn=state.turn;
        castling=state.castling;
        enPassant=state.enPassant;

        whiteTime=state.whiteTime;
        blackTime=state.blackTime;

        moveHistory=
            state.moveHistory;

        lastMove=
            state.lastMove;

    }


    selected=null;
    legalTargets=[];

    gameOver=false;

    updateMoveList();
    updateClocks();
    updateStatus();

    render();

}


/* =========================================================
   NEW GAME
========================================================= */

function newGame(){

    const selectedTime=
        Number(
            document.getElementById(
                "timeControl"
            ).value
        );


    baseMinutes=selectedTime;

    if(selectedTime===15)
        increment=10;
    else
        increment=0;


    whiteTime=
        baseMinutes*60;

    blackTime=
        baseMinutes*60;


    board=
        initialBoard();

    turn="w";

    selected=null;

    legalTargets=[];

    gameOver=false;

    history=[];

    moveHistory=[];

    enPassant=null;

    lastMove=null;

    castling={
        wK:true,
        wQ:true,
        bK:true,
        bQ:true
    };


    stopClock();

    updateClocks();

    updateMoveList();

    document.getElementById(
        "status"
    ).textContent=
        "Your turn — White";

    render();

    startClock();

}


function updateStatus(){

    if(gameOver)
        return;

    document.getElementById(
        "status"
    ).textContent=
        turn==="w"
        ?"Your turn — White"
        :"Computer's turn — Black";

}


/* =========================================================
   MODAL
========================================================= */

function showGameOver(
    icon,
    title,
    text
){

    document.getElementById(
        "modalIcon"
    ).textContent=icon;

    document.getElementById(
        "modalTitle"
    ).textContent=title;

    document.getElementById(
        "modalText"
    ).textContent=text;

    document.getElementById(
        "modal"
    ).classList.add("show");

}


function closeModal(){

    document.getElementById(
        "modal"
    ).classList.remove("show");

}


/* =========================================================
   START
========================================================= */

newGame();
