<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Of Emotions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        /* Ambient Glow behind elements */
        .glow {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(230, 0, 40, 0.25) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* 1. INITIAL CARD */
        .card {
            z-index: 2;
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            width: 280px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .card .top-icon {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .card h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card p {
            font-size: 10px;
            color: #777;
            letter-spacing: 1px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .btn {
            background: #e60026;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, background 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
            background: #cc0022;
        }

        /* 2. ROSE ANIMATION */
        .rose-stage {
            display: none;
            z-index: 2;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
        }

        /* Stem growing */
        .stem {
            width: 4px;
            height: 0px;
            background: #2e7d32;
            border-radius: 2px;
            transition: height 1.2s ease-out;
            position: relative;
        }

        /* Leaves on stem */
        .stem::before, .stem::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 6px;
            background: #2e7d32;
            border-radius: 10px 0 10px 0;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .stem::before { top: 40%; left: -10px; transform: rotate(-30deg); }
        .stem::after { top: 60%; right: -10px; transform: rotate(30deg); }

        .stem.grown::before, .stem.grown::after {
            opacity: 1;
        }

        /* Flower blooming */
        .flower {
            font-size: 70px;
            transform: scale(0);
            opacity: 0;
            transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: -10px;
            filter: drop-shadow(0 0 12px rgba(230, 0, 40, 0.6));
        }

        .flower.bloom {
            transform: scale(1);
            opacity: 1;
        }

        /* Caption under flower */
        .bloom-caption {
            opacity: 0;
            margin-top: 25px;
            font-size: 10px;
            letter-spacing: 2px;
            color: #aaa;
            text-align: center;
            transition: opacity 0.8s;
        }

        /* 3. LETTER / MESSAGE BOX */
        .letter-box {
            display: none;
            z-index: 2;
            background: rgba(12, 12, 12, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 24px;
            width: 310px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #555;
            font-size: 14px;
        }

        .letter-box h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #ffffff;
            font-style: italic;
        }

        .typed-content {
            font-size: 11.5px;
            line-height: 1.6;
            color: #cccccc;
            min-height: 180px;
            white-space: pre-line;
        }

        /* Cursor blinking */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 12px;
            background: #e60026;
            margin-left: 2px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="screen">
        <div class="glow"></div>

        <!-- Step 1: Initial Card -->
        <div class="card" id="startCard">
            <div class="top-icon">🌹</div>
            <h2>Loading Love</h2>
            <p>READY TO BLOOM FOR LOVE ❤️</p>
            <button class="btn" onclick="bloomProcess()">TAP TO BLOOM FOR LOVE ❤️</button>
        </div>

        <!-- Step 2: Rose Growing Stage -->
        <div class="rose-stage" id="roseStage">
            <div class="flower" id="roseFlower">🌹</div>
            <div class="stem" id="roseStem"></div>
            <div class="bloom-caption" id="bloomCaption">
                EVERY PETAL BLOOMS WITH LOVE<br>
                <span style="color:#fff; font-weight:bold;">for love ❤️</span>
            </div>
        </div>

        <!-- Step 3: Letter Box with Typing Animation -->
        <div class="letter-box" id="letterBox">
            <span class="close-btn">✖</span>
            <h3>Dear Love</h3>
            <div class="typed-content"><span id="typewriterText"></span><span class="cursor" id="cursor"></span></div>
        </div>
    </div>

    <script>
        // Video text exact replica
        const fullMessage = "Every single line of this code was written with you in my heart. Just like this digital rose, my love for you blooms uniquely, growing stronger and more beautiful with every passing moment.\n\nYou are the brightness in my thoughts, the rhythm in my heart, and the warmth in my life. This rose is a small reflection of my feelings—timeless, true, and forever yours.\n\nYours forever ❤️";

        function bloomProcess() {
            // 1. Hide start card
            document.getElementById('startCard').style.display = 'none';

            // 2. Show rose stage
            const roseStage = document.getElementById('roseStage');
            const stem = document.getElementById('roseStem');
            const flower = document.getElementById('roseFlower');
            const caption = document.getElementById('bloomCaption');
            
            roseStage.style.display = 'flex';

            // Grow stem first
            setTimeout(() => {
                stem.style.height = '90px';
                stem.classList.add('grown');
            }, 100);

            // Bloom flower
            setTimeout(() => {
                flower.classList.add('bloom');
            }, 1000);

            // Show caption below
            setTimeout(() => {
                caption.style.opacity = '1';
            }, 1800);

            // 3. Hide rose stage & start Letter Typing
            setTimeout(() => {
                roseStage.style.display = 'none';
                startLetterTyping();
            }, 4200);
        }

        function startLetterTyping() {
            const letterBox = document.getElementById('letterBox');
            const textElement = document.getElementById('typewriterText');
            letterBox.style.display = 'block';

            let index = 0;
            function typeNextChar() {
                if (index < fullMessage.length) {
                    textElement.innerText += fullMessage.charAt(index);
                    index++;
                    setTimeout(typeNextChar, 35); // Typing speed
                }
            }
            typeNextChar();
        }
    </script>

</body>
</html>
